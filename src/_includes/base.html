<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>

    <!-- SEO Meta -->
    <meta name="description" content="{{ description }}">
    <meta name="robots" content="{{ 'noindex, follow' if noindex else 'index, follow' }}">
    <meta name="theme-color" content="#06060c">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://viabolat.com{{ page.url }}" />

    <!-- SEO Keywords -->
    <meta name="keywords" content="{{ keywords }}">

    <!-- Open Graph (social sharing) -->
    <meta property="og:title" content="{{ title }}" />
    <meta property="og:description" content="{{ description }}" />
    <meta property="og:image" content="https://viabolat.com{{ image or '/assets/images/logo.svg' }}" />
    <meta property="og:url" content="https://viabolat.com{{ page.url }}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="viabolat" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ title }}">
    <meta name="twitter:description" content="{{ description }}">
    <meta name="twitter:image" content="https://viabolat.com{{ image or '/assets/images/logo.svg' }}">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Optional Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="{{ '/assets/images/logo.svg' | bust }}" type="image/svg+xml" />

    <link rel="stylesheet" href="/assets/css/styles.css?v={{ assetVersion.css }}" />
    <script src="/assets/js/script.js?v={{ assetVersion.js }}" defer></script>

    <!-- Structured data (schema.org) — real business + founder only; no ratings/reviews -->
    {% raw %}<script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ProfessionalService",
          "@id": "https://viabolat.com/#business",
          "name": "viabolat",
          "url": "https://viabolat.com",
          "image": "https://viabolat.com/assets/images/logo.svg",
          "logo": "https://viabolat.com/assets/images/logo.svg",
          "email": "contact@viabolat.com",
          "description": "Automation creation, repair, and maintenance — building, diagnosing, fixing, and maintaining Zapier, Make, webhook, API, and Python automations, at fixed prices.",
          "areaServed": "Worldwide",
          "knowsAbout": ["Zapier", "Make", "Webhooks", "REST APIs", "Python automation", "Data pipelines"],
          "sameAs": ["https://github.com/viabolat", "https://linkedin.com/in/ahmetbolat"],
          "founder": { "@id": "https://viabolat.com/#founder" }
        },
        {
          "@type": "Person",
          "@id": "https://viabolat.com/#founder",
          "name": "Ahmet Bolat",
          "jobTitle": "Automation Engineer",
          "url": "https://viabolat.com",
          "worksFor": { "@id": "https://viabolat.com/#business" },
          "description": "Automation and data engineer with enterprise experience at Accenture (data engineering, 2023-2025) and production automation at Karma Graphics (2016-2022).",
          "sameAs": ["https://linkedin.com/in/ahmetbolat", "https://github.com/viabolat"]
        },
        {
          "@type": "WebSite",
          "@id": "https://viabolat.com/#website",
          "url": "https://viabolat.com",
          "name": "viabolat",
          "publisher": { "@id": "https://viabolat.com/#business" }
        }
      ]
    }
    </script>{% endraw %}
</head>

<body class="min-h-screen flex flex-col bg-ink-950 text-gray-900">
    {% include "header.html" %}
    <main class="flex-grow">
        {{ content | safe }}
    </main>
    {% include "footer.html" %}
</body>

</html>
